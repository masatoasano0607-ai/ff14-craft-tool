<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF14 製作素材ツール</title>

<style>
:root{
  --bg:#10151d;
  --panel:#19212c;
  --panel2:#202a37;
  --line:#354357;
  --line2:#53637a;
  --text:#eef2f6;
  --sub:#93a0b2;
  --gold:#dfb25f;
  --green:#75cf94;
  --red:#ff9c94;
  --blue:#77a8df;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 15px;
  cursor:pointer;
  font-weight:700;
  background:var(--gold);
  color:#1b150b;
}

button:hover{
  filter:brightness(1.08);
}

button:disabled{
  opacity:.45;
  cursor:default;
}

button.secondary{
  color:var(--text);
  background:#2c3747;
}

button.danger{
  color:#ffd8d4;
  background:#542b30;
  border:1px solid #7d4148;
}

input,
select{
  border:1px solid #47576d;
  background:#0d131b;
  color:white;
  border-radius:8px;
  padding:9px 10px;
}

input:focus,
select:focus{
  outline:2px solid rgba(223,178,95,.28);
  border-color:var(--gold);
}


/* =========================
   全体
========================= */

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  padding:14px 18px;
  background:#18212d;
  border-bottom:1px solid var(--line);
}

.header-inner{
  max-width:1800px;
  margin:0 auto;
}

.title{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}


/* =========================
   検索方法タブ
========================= */

.search-tabs{
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.search-tab{
  background:#293546;
  color:var(--text);
  border:1px solid var(--line);
}

.search-tab.active{
  background:var(--gold);
  color:#1b150b;
  border-color:var(--gold);
}

.search-pane{
  display:none;
}

.search-pane.active{
  display:block;
}


/* =========================
   名前検索
========================= */

.search-row{
  display:flex;
  gap:8px;
}

#searchInput{
  flex:1;
  min-width:0;
}

.status{
  font-size:12px;
  color:var(--sub);
  margin-top:7px;
  min-height:18px;
}

.status.ok{
  color:var(--green);
}

.status.error{
  color:var(--red);
}


/* =========================
   レシピ検索
========================= */

.recipe-controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.recipe-controls select{
  min-width:150px;
}

.level-group{
  display:flex;
  gap:5px;
  align-items:center;
}

.level-group input{
  width:80px;
  text-align:center;
}

.level-label{
  color:var(--sub);
  font-size:12px;
}

.recipe-help{
  margin-top:6px;
  color:var(--sub);
  font-size:11px;
}


/* =========================
   候補
========================= */

.candidates{
  margin-top:7px;
  max-height:260px;
  overflow:auto;
}

.candidate{
  border:1px solid var(--line);
  background:#202a37;
  border-radius:8px;
  padding:9px 10px;
  margin-top:5px;
  cursor:pointer;
}

.candidate:hover{
  border-color:#667990;
  background:#273343;
}

.candidate-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.candidate-level{
  flex:none;
  color:var(--gold);
  font-size:12px;
  font-weight:800;
}

.item-name{
  font-weight:700;
}

.small{
  color:var(--sub);
  font-size:11px;
  margin-top:3px;
}


/* =========================
   選択中
========================= */

.selected{
  display:none;
  margin-top:11px;
  border-top:1px solid var(--line);
  padding-top:11px;
}

.selected-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.selected-info{
  flex:1;
  min-width:0;
}

.qty-wrap{
  display:flex;
  align-items:center;
  gap:6px;
}

.qty-label{
  color:var(--sub);
  font-size:11px;
  white-space:nowrap;
}

#qtyInput{
  width:90px;
  text-align:center;
}


/* =========================
   メイン
========================= */

.workspace{
  flex:1;
  min-height:0;
  width:100%;
  max-width:1800px;
  margin:0 auto;
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
}

.sidebar{
  min-width:0;
  border-right:1px solid var(--line);
  padding:14px;
  overflow-y:auto;
  height:calc(100vh - 180px);
}

.main{
  min-width:0;
  padding:14px;
  height:calc(100vh - 180px);
  overflow:hidden;
}

.section{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:14px;
}

.section:first-child{
  margin-top:0;
  border-top:0;
  padding-top:0;
}

.section-title{
  margin:0 0 9px;
  font-size:15px;
}

.hint{
  color:var(--sub);
  font-size:11px;
  line-height:1.5;
  margin-bottom:8px;
}

.empty{
  color:#7e8b9d;
  text-align:center;
  padding:45px 10px;
  font-size:13px;
}


/* =========================
   製作カード
========================= */

.target-card,
.craft-card{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.need-number{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.craft-controls{
  display:grid;
  grid-template-columns:1fr 85px;
  gap:7px;
  align-items:center;
  margin-top:9px;
}

.craft-controls input[type="number"]{
  width:100%;
  padding:6px;
  text-align:right;
}

.checkbox-row{
  grid-column:1 / -1;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  cursor:pointer;
}

.checkbox-row input{
  width:auto;
}


/* =========================
   最終素材
========================= */

.material-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 50px 62px 50px;
  gap:5px;
  align-items:center;
  padding:7px 2px;
  border-bottom:1px solid #293341;
  font-size:12px;
}

.material-grid.header-row{
  font-size:10px;
  color:var(--sub);
}

.material-grid input{
  width:100%;
  padding:5px 4px;
  text-align:right;
}

.number{
  text-align:right;
}

.required{
  color:var(--gold);
  font-weight:700;
}

.shortage{
  color:var(--red);
  font-weight:700;
}

.enough{
  color:var(--green);
  font-weight:700;
}


/* =========================
   ツリー
========================= */

.tree-panel{
  height:100%;
  background:#151c26;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.tree-toolbar{
  flex:none;
  padding:11px 13px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.tree-toolbar-title{
  font-weight:800;
  font-size:15px;
}

.tree-toolbar-info{
  color:var(--sub);
  font-size:10px;
}

.tree-scroll{
  flex:1;
  overflow:auto;
  padding:26px 28px 45px;
}

.tree-node{
  display:flex;
  align-items:flex-start;
  gap:46px;
  width:max-content;
}

.tree-card{
  position:relative;
  width:185px;
  min-width:185px;
  background:#202b39;
  border:1px solid #40516a;
  border-radius:9px;
  padding:10px;
}

.tree-card.root{
  background:#29261c;
  border:2px solid var(--gold);
}

.tree-card.leaf{
  background:#18212b;
}

.tree-card.stopped{
  border-color:#d39e4e;
}

.tree-card.covered{
  border-color:#5caf78;
}

.tree-card.shared{
  border-color:var(--blue);
}

.tree-name{
  font-size:13px;
  font-weight:800;
  line-height:1.4;
}

.tree-amount{
  color:var(--gold);
  font-size:14px;
  font-weight:800;
  margin-top:5px;
}

.tree-info{
  color:var(--sub);
  font-size:10px;
  margin-top:4px;
  line-height:1.4;
}

.tree-good{
  color:var(--green);
}

.tree-shared{
  color:#8fc1f3;
}

.tree-children{
  display:flex;
  flex-direction:column;
  gap:13px;
  position:relative;
}

.tree-child{
  position:relative;
}

.tree-child::before{
  content:"";
  position:absolute;
  left:-46px;
  top:24px;
  width:46px;
  border-top:1px solid var(--line2);
}

.tree-children::before{
  content:"";
  position:absolute;
  left:-46px;
  top:24px;
  bottom:24px;
  border-left:1px solid var(--line2);
}


/* =========================
   スマホ
========================= */

@media(max-width:800px){

  .header{
    padding:10px;
  }

  .title{
    font-size:18px;
  }

  .search-tabs{
    width:100%;
  }

  .search-tab{
    flex:1;
  }

  .recipe-controls{
    display:grid;
    grid-template-columns:1fr;
  }

  .recipe-controls select{
    width:100%;
  }

  .level-group{
    width:100%;
  }

  .level-group input{
    flex:1;
    width:auto;
  }

  .selected-row{
    flex-wrap:wrap;
  }

  .selected-info{
    flex-basis:100%;
  }

  .qty-wrap{
    flex:1;
  }

  #qtyInput{
    flex:1;
    width:auto;
  }

  .workspace{
    display:block;
  }

  .sidebar{
    height:auto;
    overflow:visible;
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:10px;
  }

  .main{
    height:auto;
    padding:10px;
    overflow:visible;
  }

  .tree-panel{
    height:auto;
  }

  .tree-scroll{
    overflow-x:hidden;
    overflow-y:visible;
    padding:12px 8px 25px;
  }

  .tree-node{
    display:block;
    width:auto;
  }

  .tree-card{
    width:100%;
    min-width:0;
  }

  .tree-children{
    margin-top:8px;
    margin-left:14px;
    padding-left:14px;
    border-left:1px solid var(--line2);
  }

  .tree-children::before{
    display:none;
  }

  .tree-child{
    margin-top:8px;
  }

  .tree-child::before{
    left:-14px;
    width:14px;
    top:23px;
  }

  .tree-toolbar-info{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="header-inner">

  <div class="title">
    FF14 製作素材ツール
  </div>


  <div class="search-tabs">

    <button
      id="nameTab"
      class="search-tab active"
    >
      名前から検索
    </button>

    <button
      id="recipeTab"
      class="search-tab"
    >
      レシピから選ぶ
    </button>

  </div>


  <!-- =====================
       名前検索
  ====================== -->

  <div
    id="namePane"
    class="search-pane active"
  >

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="作りたいアイテム名（ひらがなでもOK）"
        autocomplete="off"
      >

      <button id="searchButton">
        検索
      </button>

    </div>

  </div>


  <!-- =====================
       レシピ検索
  ====================== -->

  <div
    id="recipePane"
    class="search-pane"
  >

    <div class="recipe-controls">

      <select id="craftSelect">

        <option value="木工">
          木工師
        </option>

        <option value="鍛冶">
          鍛冶師
        </option>

        <option value="甲冑">
          甲冑師
        </option>

        <option value="彫金">
          彫金師
        </option>

        <option value="革細工">
          革細工師
        </option>

        <option value="裁縫">
          裁縫師
        </option>

        <option value="錬金">
          錬金術師
        </option>

        <option value="調理">
          調理師
        </option>

      </select>


      <div class="level-group">

        <span class="level-label">
          Lv
        </span>

        <input
          id="minLevel"
          type="number"
          min="1"
          max="100"
          value="1"
        >

        <span>
          ～
        </span>

        <input
          id="maxLevel"
          type="number"
          min="1"
          max="100"
          value="100"
        >

      </div>


      <button id="recipeSearchButton">
        レシピ一覧
      </button>

    </div>


    <div class="recipe-help">
      製作クラスとレベル帯を選んで一覧表示
    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    アイテム名を2文字以上入力してください
  </div>


  <div
    id="candidates"
    class="candidates"
  ></div>


  <div
    id="selected"
    class="selected"
  >

    <div class="selected-row">

      <div class="selected-info">

        <div
          id="selectedName"
          class="item-name"
        ></div>

        <div
          id="selectedDetail"
          class="small"
        ></div>

      </div>


      <div class="qty-wrap">

        <span class="qty-label">
          作る個数
        </span>

        <input
          id="qtyInput"
          type="number"
          min="1"
          inputmode="numeric"
          value="1"
        >

      </div>


      <button id="calculateButton">
        計算
      </button>


      <button
        id="resetOwnedButton"
        class="danger"
      >
        所持数をすべて0
      </button>


      <button
        id="clearButton"
        class="secondary"
      >
        解除
      </button>

    </div>

  </div>

</div>

</header>


<div class="workspace">


<aside
  id="sidebar"
  class="sidebar"
>

  <div class="empty">
    アイテムを検索して<br>
    製作素材を計算してください
  </div>

</aside>


<main class="main">

  <div class="tree-panel">

    <div class="tree-toolbar">

      <div class="tree-toolbar-title">
        素材ツリー
      </div>

      <div class="tree-toolbar-info">
        PC：左 → 右　／　スマホ：上 → 下
      </div>

    </div>


    <div
      id="treeScroll"
      class="tree-scroll"
    >

      <div class="empty">
        ここに素材ツリーが表示されます
      </div>

    </div>

  </div>

</main>


</div>

</div>


<script>
(() => {

"use strict";


const API =
  "https://v2.xivapi.com/api";


const nameTab =
  document.getElementById(
    "nameTab"
  );

const recipeTab =
  document.getElementById(
    "recipeTab"
  );

const namePane =
  document.getElementById(
    "namePane"
  );

const recipePane =
  document.getElementById(
    "recipePane"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const craftSelect =
  document.getElementById(
    "craftSelect"
  );

const minLevel =
  document.getElementById(
    "minLevel"
  );

const maxLevel =
  document.getElementById(
    "maxLevel"
  );

const recipeSearchButton =
  document.getElementById(
    "recipeSearchButton"
  );

const status =
  document.getElementById(
    "status"
  );

const candidates =
  document.getElementById(
    "candidates"
  );

const selectedBox =
  document.getElementById(
    "selected"
  );

const selectedName =
  document.getElementById(
    "selectedName"
  );

const selectedDetail =
  document.getElementById(
    "selectedDetail"
  );

const qtyInput =
  document.getElementById(
    "qtyInput"
  );

const calculateButton =
  document.getElementById(
    "calculateButton"
  );

const resetOwnedButton =
  document.getElementById(
    "resetOwnedButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const sidebar =
  document.getElementById(
    "sidebar"
  );

const treeScroll =
  document.getElementById(
    "treeScroll"
  );


let selectedItem =
  null;

let searchTimer =
  null;


const recipeCache =
  new Map();

const owned = {};

const craftMode = {};


/* ========================================
   保存
======================================== */

function loadSettings(){

  try{

    Object.assign(
      owned,
      JSON.parse(
        localStorage.getItem(
          "ff14_owned_v5"
        ) || "{}"
      )
    );

    Object.assign(
      craftMode,
      JSON.parse(
        localStorage.getItem(
          "ff14_craftmode_v5"
        ) || "{}"
      )
    );

  }catch(error){

    console.warn(
      "設定読み込み失敗",
      error
    );

  }

}


function saveSettings(){

  try{

    localStorage.setItem(
      "ff14_owned_v5",
      JSON.stringify(
        owned
      )
    );

    localStorage.setItem(
      "ff14_craftmode_v5",
      JSON.stringify(
        craftMode
      )
    );

  }catch(error){

    console.warn(
      "設定保存失敗",
      error
    );

  }

}


loadSettings();


/* ========================================
   共通
======================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[character]
  );

}


function escapeQuery(value){

  return String(value)
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /"/g,
    '\\"'
  );

}


/* ひらがな → カタカナ */

function hiraganaToKatakana(
  value
){

  return String(value)
  .replace(
    /[\u3041-\u3096]/g,
    character =>
      String.fromCharCode(
        character.charCodeAt(0)
        + 0x60
      )
  );

}


function itemKey(item){

  return String(
    item.id ||
    item.name
  );

}


function ownedQty(item){

  return Math.max(
    0,
    Math.floor(
      Number(
        owned[
          itemKey(item)
        ] || 0
      )
    )
  );

}


function shouldCraft(item){

  const key =
    itemKey(item);

  if(
    craftMode[key]
    === undefined
  ){

    return true;

  }

  return Boolean(
    craftMode[key]
  );

}


function setStatus(
  text,
  type=""
){

  status.textContent =
    text;

  status.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );

}


/* ========================================
   タブ
======================================== */

function showSearchMode(
  mode
){

  const nameMode =
    mode === "name";

  nameTab.classList.toggle(
    "active",
    nameMode
  );

  recipeTab.classList.toggle(
    "active",
    !nameMode
  );

  namePane.classList.toggle(
    "active",
    nameMode
  );

  recipePane.classList.toggle(
    "active",
    !nameMode
  );

  candidates.innerHTML =
    "";

  if(nameMode){

    setStatus(
      "アイテム名を2文字以上入力してください"
    );

  }else{

    setStatus(
      "製作クラスとレベル帯を選んでください"
    );

  }

}


/* ========================================
   API
======================================== */

async function api(
  path,
  params={}
){

  const url =
    new URL(
      API + path
    );


  for(
    const [key,value]
    of Object.entries(
      params
    )
  ){

    if(
      value !== undefined &&
      value !== null &&
      value !== ""
    ){

      url.searchParams.set(
        key,
        String(value)
      );

    }

  }


  const response =
    await fetch(
      url.toString()
    );


  if(
    !response.ok
  ){

    throw new Error(
      "XIVAPI HTTP " +
      response.status
    );

  }


  return response.json();

}


/* ========================================
   名前検索
======================================== */

async function searchItems(){

  const originalWord =
    searchInput.value
    .trim();


  if(
    originalWord.length < 2
  ){

    candidates.innerHTML =
      "";

    setStatus(
      "アイテム名を2文字以上入力してください"
    );

    return;

  }


  const word =
    hiraganaToKatakana(
      originalWord
    );


  setStatus(
    originalWord === word
      ? "検索中…"

/* ========================================
   レシピ一覧
======================================== */

async function browseRecipes(){

  let low =
    Math.max(
      1,
      Math.floor(
        Number(
          minLevel.value
        ) || 1
      )
    );


  let high =
    Math.max(
      1,
      Math.floor(
        Number(
          maxLevel.value
        ) || 100
      )
    );


  low =
    Math.min(
      low,
      100
    );

  high =
    Math.min(
      high,
      100
    );


  if(
    low > high
  ){

    const temp =
      low;

    low =
      high;

    high =
      temp;

  }


  minLevel.value =
    low;

  maxLevel.value =
    high;


  const craft =
    craftSelect.value;


  candidates.innerHTML =
    "";


  recipeSearchButton.disabled =
    true;


  setStatus(
    `${craftSelect.options[
      craftSelect.selectedIndex
    ].text} Lv${low}～${high} を検索中…`
  );


  try{

    const fields = [

      "ItemResult.Name",

      "AmountResult",

      "CraftType.Name",

      "RecipeLevelTable.ClassJobLevel",

      "IsSecondary"

    ].join(",");


    const query =

      `+CraftType.Name="${escapeQuery(
        craft
      )}" ` +

      `+RecipeLevelTable.ClassJobLevel>=${low} ` +

      `+RecipeLevelTable.ClassJobLevel<=${high} ` +

      `+IsSecondary=false`;


    let data =
      await api(
        "/search",
        {

          sheets:
            "Recipe",

          fields,

          language:
            "ja",

          limit:
            100,

          query

        }
      );


    const rows =
      [];


    rows.push(
      ...(
        data.results || []
      )
    );


    /*
      一覧が100件を超える場合も
      最大500件まで続きを取得
    */
    let cursor =
      data.next || null;

    let page =
      1;


    while(
      cursor &&
      page < 5
    ){

      data =
        await api(
          "/search",
          {

            fields,

            language:
              "ja",

            limit:
              100,

            cursor

          }
        );


      rows.push(
        ...(
          data.results || []
        )
      );


      cursor =
        data.next || null;

      page++;

    }


    const map =
      new Map();


    for(
      const row
      of rows
    ){

      const fields =
        row.fields || {};


      const result =
        relationFields(
          fields.ItemResult
        );


      const itemId =
        relationId(
          fields.ItemResult
        );


      const name =
        result.Name || "";


      const craftFields =
        relationFields(
          fields.CraftType
        );


      const levelFields =
        relationFields(
          fields.RecipeLevelTable
        );


      const level =
        Number(
          levelFields.ClassJobLevel ||
          0
        );


      const yieldAmount =
        Math.max(
          1,
          Number(
            fields.AmountResult ||
            1
          )
        );


      if(
        !itemId ||
        !name
      ){

        continue;

      }


      /*
        同じ完成品が複数レシピで
        出た場合は1個だけ表示
      */
      if(
        !map.has(
          itemId
        )
      ){

        map.set(
          itemId,
          {

            recipeId:
              Number(
                row.row_id || 0
              ),

            item:{
              id:itemId,
              name
            },

            craft:
              craftFields.Name ||
              craft,

            level,

            yield:
              yieldAmount

          }
        );

      }

    }


    const recipes =
      [
        ...map.values()
      ]
      .sort(
        (a,b) =>

          a.level -
          b.level

          ||

          a.item.name.localeCompare(
            b.item.name,
            "ja"
          )
      );


    renderRecipeCandidates(
      recipes,
      low,
      high
    );


  }catch(error){

    console.error(
      error
    );


    setStatus(
      "レシピ検索エラー：" +
      error.message,
      "error"
    );


  }finally{

    recipeSearchButton.disabled =
      false;

  }

}

/* ========================================
   Relationship
======================================== */

function relationFields(
  value
){

  if(
    !value ||
    typeof value !==
      "object"
  ){

    return {};

  }


  if(
    value.fields &&
    typeof value.fields ===
      "object"
  ){

    return value.fields;

  }


  return value;

}


function relationId(
  value
){

  if(
    !value ||
    typeof value !==
      "object"
  ){

    return 0;

  }


  return Number(

    value.row_id ??

    value.rowId ??

    value.value ??

    value.id ??

    0

  ) || 0;

}


/* ========================================
   レシピ詳細取得
======================================== */

async function getRecipes(
  name
){

  if(
    recipeCache.has(
      name
    )
  ){

    return recipeCache.get(
      name
    );

  }


  const fields = [

    "ItemResult.Name",

    "AmountResult",

    "AmountIngredient",

    "Ingredient[].Name",

    "CraftType.Name",

    "RecipeLevelTable.ClassJobLevel",

    "IsSecondary"

  ].join(",");


  const data =
    await api(
      "/search",
      {

        sheets:
          "Recipe",

        fields,

        language:
          "ja",

        limit:
          30,

        query:
          `ItemResult.Name="${escapeQuery(
            name
          )}"`

      }
    );


  const recipes =
    (
      data.results ||
      []
    )
    .map(
      row => {

        const fields =
          row.fields ||
          {};


        const result =
          relationFields(
            fields.ItemResult
          );


        const craft =
          relationFields(
            fields.CraftType
          );


        const level =
          relationFields(
            fields.RecipeLevelTable
          );


        const ingredientMap =
          new Map();


        const ingredients =
          Array.isArray(
            fields.Ingredient
          )

          ? fields.Ingredient

          : [];


        ingredients.forEach(
          (
            ingredient,
            index
          ) => {

            const ingredientFields =
              relationFields(
                ingredient
              );


            const id =
              relationId(
                ingredient
              );


            const ingredientName =
              ingredientFields.Name ||
              "";


            const amount =
              Number(

                Array.isArray(
                  fields.AmountIngredient
                )

                ? fields
                    .AmountIngredient[
                      index
                    ] || 0

                : 0

              );


            if(
              !id ||
              !ingredientName ||
              amount <= 0
            ){

              return;

            }


            const key =
              String(id);


            if(
              ingredientMap.has(
                key
              )
            ){

              ingredientMap
              .get(key)
              .amount +=
                amount;

            }else{

              ingredientMap.set(
                key,
                {
                  id,
                  name:
                    ingredientName,
                  amount
                }
              );

            }

          }
        );


        return {

          id:
            Number(
              row.row_id ||
              0
            ),

          resultName:
            result.Name ||
            "",

          yield:
            Math.max(
              1,
              Number(
                fields.AmountResult ||
                1
              )
            ),

          craft:
            craft.Name ||
            "製作",

          level:
            Number(
              level.ClassJobLevel ||
              0
            ),

          secondary:
            Boolean(
              fields.IsSecondary
            ),

          ingredients:
            [
              ...ingredientMap
              .values()
            ]

        };

      }
    )
    .filter(
      recipe =>
        recipe.resultName ===
          name

        &&

        recipe.ingredients
        .length
    );


  recipes.sort(
    (a,b) =>

      Number(
        a.secondary
      )

      -

      Number(
        b.secondary
      )

      ||

      a.level -
      b.level

      ||

      a.id -
      b.id
  );


  recipeCache.set(
    name,
    recipes
  );


  return recipes;

}


/* ========================================
   集計
======================================== */

function addFinal(
  context,
  item,
  required,
  used,
  shortage,
  stopped=false
){

  const key =
    itemKey(
      item
    );


  if(
    !context.finals.has(
      key
    )
  ){

    context.finals.set(
      key,
      {

        item,

        required:0,

        used:0,

        shortage:0,

        stopped:false

      }
    );

  }


  const entry =
    context.finals.get(
      key
    );


  entry.required +=
    required;

  entry.used +=
    used;

  entry.shortage +=
    shortage;


  if(
    stopped
  ){

    entry.stopped =
      true;

  }

}


function addCraft(
  context,
  item,
  recipe,
  required,
  used,
  shortage,
  runs
){

  const key =
    itemKey(
      item
    );


  context.crafts.set(
    key,
    {

      item,

      recipe,

      required,

      used,

      shortage,

      runs

    }
  );

}


/* ========================================
   グラフ作成
======================================== */

async function buildGraph(
  item,
  graph,
  path=new Set(),
  depth=0,
  isRoot=false
){

  const key =
    itemKey(
      item
    );


  if(
    graph.has(
      key
    )
  ){

    return key;

  }


  const node = {

    item,

    recipe:null,

    children:[],

    cycle:false

  };


  graph.set(
    key,
    node
  );


  if(
    depth > 25
  ){

    return key;

  }


  let recipes = [];


  try{

    recipes =
      await getRecipes(
        item.name
      );

  }catch(error){

    console.error(
      "レシピ取得失敗",
      item.name,
      error
    );

    return key;

  }


  node.recipe =
    recipes[0] ||
    null;


  if(
    !node.recipe
  ){

    return key;

  }


  if(
    !isRoot &&
    !shouldCraft(
      item
    )
  ){

    return key;

  }


  const nextPath =
    new Set(
      path
    );


  nextPath.add(
    key
  );


  for(
    const ingredient
    of node.recipe
      .ingredients
  ){

    const childItem = {

      id:
        ingredient.id,

      name:
        ingredient.name

    };


    const childKey =
      itemKey(
        childItem
      );


    const edge = {

      key:
        childKey,

      item:
        childItem,

      amount:
        ingredient.amount,

      cycle:false

    };


    if(
      nextPath.has(
        childKey
      )
    ){

      edge.cycle =
        true;


      node.children.push(
        edge
      );


      continue;

    }


    node.children.push(
      edge
    );


    await buildGraph(
      childItem,
      graph,
      nextPath,
      depth + 1,
      false
    );

  }


  return key;

}


/* ========================================
   子ノード解放
======================================== */

function releaseChildren(
  node,
  indegree,
  queue
){

  const released =
    new Set();


  for(
    const edge
    of node.children
  ){

    if(
      edge.cycle ||
      released.has(
        edge.key
      )
    ){

      continue;

    }


    released.add(
      edge.key
    );


    const next =
      (
        indegree.get(
          edge.key
        ) || 0
      )
      - 1;


    indegree.set(
      edge.key,
      next
    );


    if(
      next === 0
    ){

      queue.push(
        edge.key
      );

    }

  }

}


/* ========================================
   集約計算
======================================== */

function calculateGraph(
  graph,
  rootKey,
  targetAmount
){

  const context = {

    finals:
      new Map(),

    crafts:
      new Map()

  };


  const states =
    new Map();


  const required =
    new Map();


  const indegree =
    new Map();


  const ownedRemaining =
    new Map();


  for(
    const [key,value]
    of Object.entries(
      owned
    )
  ){

    ownedRemaining.set(
      key,
      Math.max(
        0,
        Number(
          value
        ) || 0
      )
    );

  }


  for(
    const key
    of graph.keys()
  ){

    indegree.set(
      key,
      0
    );

  }


  for(
    const node
    of graph.values()
  ){

    const counted =
      new Set();


    for(
      const edge
      of node.children
    ){

      if(
        edge.cycle ||
        counted.has(
          edge.key
        )
      ){

        continue;

      }


      counted.add(
        edge.key
      );


      indegree.set(
        edge.key,

        (
          indegree.get(
            edge.key
          ) || 0
        )

        + 1
      );

    }

  }


  required.set(
    rootKey,
    targetAmount
  );


  const queue = [];


  for(
    const [key,count]
    of indegree.entries()
  ){

    if(
      count === 0
    ){

      queue.push(
        key
      );

    }

  }


  while(
    queue.length
  ){

    const key =
      queue.shift();


    const node =
      graph.get(
        key
      );


    if(
      !node
    ){

      continue;

    }


    const isRoot =
      key ===
      rootKey;


    const requested =
      Math.max(
        0,
        Number(
          required.get(
            key
          ) || 0
        )
      );


    if(
      requested <= 0
    ){

      states.set(
        key,
        {

          item:
            node.item,

          requested:0,

          used:0,

          need:0,

          runs:0,

          recipe:
            node.recipe,

          leaf:true,

          covered:false,

          stopped:false

        }
      );


      releaseChildren(
        node,
        indegree,
        queue
      );


      continue;

    }


    let used = 0;


    if(
      !isRoot
    ){

      const available =
        Math.max(
          0,
          Number(
            ownedRemaining.get(
              key
            ) || 0
          )
        );


      used =
        Math.min(
          requested,
          available
        );


      ownedRemaining.set(
        key,
        available -
        used
      );

    }


    const need =
      Math.max(
        0,
        requested -
        used
      );


    if(
      need <= 0
    ){

      states.set(
        key,
        {

          item:
            node.item,

          requested,

          used,

          need:0,

          runs:0,

          recipe:
            node.recipe,

          leaf:true,

          covered:true,

          stopped:false

        }
      );


      releaseChildren(
        node,
        indegree,
        queue
      );


      continue;

    }


    if(
      !node.recipe
    ){

      addFinal(
        context,
        node.item,
        requested,
        used,
        need
      );


      states.set(
        key,
        {

          item:
            node.item,

          requested,

          used,

          need,

          runs:0,

          recipe:null,

          leaf:true,

          covered:false,

          stopped:false

        }
      );


      releaseChildren(
        node,
        indegree,
        queue
      );


      continue;

    }


    if(
      !isRoot &&
      !shouldCraft(
        node.item
      )
    ){

      addCraft(
        context,
        node.item,
        node.recipe,
        requested,
        used,
        need,
        0
      );


      addFinal(
        context,
        node.item,
        requested,
        used,
        need,
        true
      );


      states.set(
        key,
        {

          item:
            node.item,

          requested,

          used,

          need,

          runs:0,

          recipe:
            node.recipe,

          leaf:true,

          covered:false,

          stopped:true

        }
      );


      releaseChildren(
        node,
        indegree,
        queue
      );


      continue;

    }


    const runs =
      Math.ceil(
        need /
        node.recipe.yield
      );


    if(
      !isRoot
    ){

      addCraft(
        context,
        node.item,
        node.recipe,
        requested,
        used,
        need,
        runs
      );

    }


    states.set(
      key,
      {

        item:
          node.item,

        requested,

        used,

        need,

        runs,

        recipe:
          node.recipe,

        leaf:false,

        covered:false,

        stopped:false

      }
    );


    for(
      const edge
      of node.children
    ){

      const childRequired =
        edge.amount *
        runs;


      if(
        edge.cycle
      ){

        const childKey =
          edge.key;


        const available =
          Math.max(
            0,
            Number(
              ownedRemaining.get(
                childKey
              ) || 0
            )
          );


        const cycleUsed =
          Math.min(
            childRequired,
            available
          );


        ownedRemaining.set(
          childKey,
          available -
          cycleUsed
        );


        const cycleShortage =
          childRequired -
          cycleUsed;


        addFinal(
          context,
          edge.item,
          childRequired,
          cycleUsed,
          cycleShortage
        );


        continue;

      }


      required.set(
        edge.key,

        (
          required.get(
            edge.key
          ) || 0
        )

        +

        childRequired
      );

    }


    releaseChildren(
      node,
      indegree,
      queue
    );

  }


  return {
    context,
    states
  };

}


/* ========================================
   計算
======================================== */

async function calculate(){

  if(
    !selectedItem
  ){

    return;

  }


  const amount =
    Math.max(
      1,
      Math.floor(
        Number(
          qtyInput.value
        ) || 1
      )
    );


  qtyInput.value =
    amount;


  calculateButton.disabled =
    true;


  setStatus(
    "素材を計算しています…"
  );


  try{

    const graph =
      new Map();


    const rootKey =
      await buildGraph(
        selectedItem,
        graph,
        new Set(),
        0,
        true
      );


    const {
      context,
      states
    } =
      calculateGraph(
        graph,
        rootKey,
        amount
      );


    renderSidebar(
      context,
      amount
    );


    treeScroll.innerHTML =
      treeHTML(
        rootKey,
        graph,
        states,
        new Set(),
        true,
        null
      );


    setStatus(
      "計算完了",
      "ok"
    );


  }catch(error){

    console.error(
      error
    );


    setStatus(
      "計算エラー：" +
      error.message,
      "error"
    );


  }finally{

    calculateButton.disabled =
      false;

  }

}


/* ========================================
   左パネル
======================================== */

function renderSidebar(

    ]
    .sort(
      (a,b) =>
        a.item.name
        .localeCompare(
          b.item.name,

        )
    );


  const finals =
    [
      ...context.finals
      .values()
    ]
    .sort(
      (a,b) =>
        a.item.name
        .localeCompare(
          b.item.name,
          "ja"
        )
    );


  sidebar.innerHTML = `

    <section class="section">

      <h3 class="section-title">
        製作内容
      </h3>

      <div class="target-card">

        <div class="card-head">

          <div class="item-name">
            ${escapeHTML(
              selectedItem.name
            )}
          </div>

          <div class="need-number">
            × ${targetAmount}
          </div>

        </div>

      </div>

    </section>


    <section class="section">

      <h3 class="section-title">
        中間素材
      </h3>

      <div class="hint">

        同じ中間素材は全ルート分を
        合算してから製作回数を計算します。<br>

        所持数は自動で差し引きます。<br>

        「自作する」をOFFにすると、
        その素材より先を展開しません。

      </div>


      ${
        crafts.length

        ? crafts.map(
          craft => {

            const key =
              itemKey(
                craft.item
              );


            return `

              <div class="craft-card">

                <div class="card-head">

                  <div>

                    <div class="item-name">

                      ${escapeHTML(
                        craft.item.name
                      )}

                    </div>

                    <div class="small">

                      ${escapeHTML(
                        craft.recipe.craft
                      )}

                      ${
                        craft.recipe.level
                          ? ` Lv${craft.recipe.level}`
                          : ""
                      }

                      ${
                        craft.runs
                          ? ` / ${craft.runs}回製作`
                          : ""
                      }

                    </div>

                  </div>


                  <div class="need-number">
                    必要 ${craft.required}
                  </div>

                </div>


                <div class="craft-controls">

                  <span class="small">
                    所持数
                  </span>

                  <input
                    class="owned-input"
                    data-key="${escapeHTML(
                      key
                    )}"
                    type="number"
                    min="0"
                    inputmode="numeric"
                    value="${ownedQty(
                      craft.item
                    )}"
                  >


                  <label class="checkbox-row">

                    <input
                      class="craft-toggle"
                      data-key="${escapeHTML(
                        key
                      )}"
                      type="checkbox"
                      ${
                        shouldCraft(
                          craft.item
                        )
                          ? "checked"
                          : ""
                      }
                    >

                    自作する

                  </label>

                </div>

              </div>

            `;

          }
        )
        .join("")

        : `
          <div class="hint">
            中間素材はありません
          </div>
        `
      }

    </section>


    <section class="section">

      <h3 class="section-title">
        最終的に用意する素材
      </h3>


      <div class="material-grid header-row">

        <div>素材</div>

        <div class="number">
          必要
        </div>

        <div class="number">
          所持
        </div>

        <div class="number">
          不足
        </div>

      </div>


      ${
        finals.length

        ? finals.map(
          material => {

            const key =
              itemKey(
                material.item
              );


            const shortageClass =
              material.shortage === 0

                ? "enough"

                : "shortage";


            return `

              <div class="material-grid">

                <div>

                  <div>

                    ${escapeHTML(

                  </div>

                      ? `

                      : ""

                <div class="number required">

                <div>

                  <input

                    data-key="${escapeHTML(
                      key
                    )}"
                    type="number"
                    min="0"
                    inputmode="numeric"
                    value="${ownedQty(
                      material.item
                    )}"
                  >

                </div>


                <div
                  class="number ${shortageClass}"

                  ${material.shortage}
                </div>

              </div>

          }

        .join("")

        : `

/* ========================================
   ツリー
======================================== */

function treeHTML(
  key,
  graph,
  states,
  rendered,
  isRoot=false,
  contribution=null
){

  const node =
    graph.get(
      key
    );


  const state =
    states.get(
      key
    );


  if(
    !node ||
    !state
  ){

    return "";

  }


  if(
    state.requested <= 0 &&
    !isRoot
  ){

    return "";

  }


  const shared =
    rendered.has(
      key
    );


  if(
    !shared
  ){

    rendered.add(
      key
    );

  }


  let className =
    "tree-card";


  if(isRoot){
    className +=
      " root";
  }


  if(state.leaf){
    className +=
      " leaf";
  }


  if(state.stopped){
    className +=
      " stopped";
  }


  if(state.covered){
    className +=
      " covered";
  }


  if(shared){
    className +=
      " shared";
  }


  let info = "";


  if(
    contribution !== null &&
    contribution !==
      state.requested
  ){

    info += `

      <div class="tree-info">
        この枝から ${contribution}
      </div>

    `;

  }


  if(
    state.covered
  ){

    info += `

      <div class="tree-info tree-good">
        所持 ${state.used} で充足
      </div>

    `;

  }else{


    if(
      state.used > 0
    ){

      info += `

        <div class="tree-info">
          所持 ${state.used} 使用
        </div>

      `;

    }


    if(
      state.stopped
    ){

      info += `

        <div class="tree-info">
          自作しない
        </div>

      `;

    }else if(
      !state.leaf &&
      state.runs
    ){

      info += `

        <div class="tree-info">
          ${state.runs}回製作
        </div>

      `;

    }

  }


  if(
    shared
  ){

    info += `

      <div class="tree-info tree-shared">
        共通素材・合算済み
      </div>

    `;

  }


  const card = `

    <div class="${className}">

      <div class="tree-name">

        ${escapeHTML(
          node.item.name
        )}

      </div>

      <div class="tree-amount">
        × ${state.requested}
      </div>

      ${info}

    </div>

  `;


  if(
    shared
  ){

    return `

      <div class="tree-node">
        ${card}
      </div>

    `;

  }


  if(
    state.leaf ||
    !state.runs ||
    !node.children.length
  ){

    return `

      <div class="tree-node">
        ${card}
      </div>

    `;

  }


  const childrenHTML =
    node.children
    .map(
      edge => {


        if(
          edge.cycle
        ){

          return `

            <div class="tree-child">

              <div class="tree-node">

                <div class="tree-card leaf">

                  <div class="tree-name">

                    ${escapeHTML(
                      edge.item.name
                    )}

                  </div>

                  <div class="tree-amount">

                    × ${
                      edge.amount *
                      state.runs
                    }

                  </div>

                  <div class="tree-info">
                    循環防止のため展開停止
                  </div>

                </div>

              </div>

            </div>

          `;

        }


        const childState =
          states.get(
            edge.key
          );


        if(
          !childState ||
          childState.requested <= 0
        ){

          return "";

        }


        const contribution =
          edge.amount *
          state.runs;


        return `

          <div class="tree-child">

            ${treeHTML(
              edge.key,
              graph,
              states,
              rendered,
              false,
              contribution
            )}

          </div>

        `;

      }
    )
    .join("");


  return `

    <div class="tree-node">

      ${card}

      <div class="tree-children">

        ${childrenHTML}

      </div>

    </div>

  `;

}


/* ========================================
   左パネル操作
======================================== */

function bindSidebarEvents(){

  sidebar
  .querySelectorAll(
    ".owned-input"
  )
  .forEach(
    input => {

      input.addEventListener(
        "change",
        () => {

          const key =
            input.dataset.key;


          owned[key] =
            Math.max(
              0,
              Math.floor(
                Number(
                  input.value
                ) || 0
              )
            );


          saveSettings();

          calculate();

        }
      );

    }
  );


  sidebar
  .querySelectorAll(
    ".craft-toggle"
  )
  .forEach(
    input => {

      input.addEventListener(
        "change",
        () => {

          const key =
            input.dataset.key;


          craftMode[key] =
            input.checked;


          saveSettings();

          calculate();

        }
      );

    }
  );

}


/* ========================================
   所持数リセット
======================================== */

async function resetAllOwned(){

  const hasOwned =
    Object.values(
      owned
    )
    .some(
      value =>
        Number(
          value
        ) > 0
    );


  if(
    !hasOwned
  ){

    setStatus(
      "所持数はすでにすべて0です",
      "ok"
    );

    return;

  }


  const ok =
    confirm(
      "登録している所持数をすべて0に戻しますか？\n\n自作する設定や製作個数は変更されません。"
    );


  if(
    !ok
  ){

    return;

  }


  for(
    const key
    of Object.keys(
      owned
    )
  ){

    delete owned[key];

  }


  saveSettings();


  if(
    selectedItem
  ){

    await calculate();

  }


  setStatus(
    "所持数をすべて0に戻しました",
    "ok"
  );

}

  selectedItem =

  searchInput.value =

  candidates.innerHTML =

  selectedBox.style.display =

  sidebar.innerHTML = `

    </div>

  treeScroll.innerHTML = `

    <div class="empty">
      ここに素材ツリーが表示されます
    </div>

  `;


  setStatus(
    "アイテムを選んでください"
  );

}
